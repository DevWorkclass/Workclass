# ============================================================================
# Render Blueprint — Work Class Gabon Backend
# https://render.com/docs/blueprint-spec
# ----------------------------------------------------------------------------
# Déploie le backend Express depuis le dossier `backend/` via Dockerfile.
# Base PostgreSQL externalisée sur Supabase (pooler + direct).
# Redis externalisé sur Upstash (optionnel, fallback in-memory si absent).
# Schéma Prisma synchronisé automatiquement à chaque deploy via preDeployCommand (db push).
# ----------------------------------------------------------------------------
# Usage :
#   1. https://dashboard.render.com/blueprints → New Blueprint Instance
#   2. Sélectionner le repo `DevWorkclass/Workclass`
#   3. Renseigner les valeurs des `sync: false` ci-dessous
# ============================================================================

services:
  - type: web
    name: workclass-backend
    runtime: docker
    plan: starter
    region: frankfurt
    # Dockerfile à la racine du repo (Render ne respecte pas rootDir + dockerfilePath ensemble).
    # Le Dockerfile copie explicitement depuis backend/ pendant le build.
    healthCheckPath: /api/health
    autoDeploy: true

    # Schéma synchronisé AVANT le démarrage du nouveau conteneur.
    # `schema.prisma` est la source de vérité (db push, pas de migrations versionnées).
    # --accept-data-loss requis en non-interactif ; sûr ici car aucune migration destructive.
    preDeployCommand: "npx prisma db push --skip-generate --accept-data-loss"

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: API_BASE_PATH
        value: /api
      - key: LOG_LEVEL
        value: info

      # --- Base de données Supabase ---
      # DATABASE_URL = pooler transaction (port 6543, ?pgbouncer=true)
      # DIRECT_URL   = direct (port 5432) — requis par Prisma migrate
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      # --- Supabase API (Storage / Auth) ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: documents

      # --- Redis (Upstash — optionnel) ---
      - key: REDIS_URL
        sync: false

      # --- URLs frontend (à mettre à jour après deploy Vercel) ---
      - key: FRONTEND_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false

      # --- Secrets cryptographiques (générés automatiquement par Render) ---
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: QR_HMAC_SECRET
        generateValue: true
      - key: FEEDBACK_TOKEN_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h

      # --- Emails (Resend) ---
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: Work Class Gabon

      # --- Stockage local PDFs (Render disk éphémère — v1 acceptable) ---
      # v2 : passer sur Supabase Storage en utilisant SUPABASE_STORAGE_BUCKET
      - key: LOCAL_STORAGE_PATH
        value: /app/backend/uploads

      # --- Rate limiting ---
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "100"

      # --- Seed admin (au premier déploiement, à exécuter manuellement) ---
      # Render Shell : `npm run db:seed` après avoir set SEED_ADMIN_PASSWORD
      - key: SEED_ADMIN_PASSWORD
        sync: false
